name: Build Attack Matrix

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  generate-matrix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: tooling/go.mod
          cache-dependency-path: tooling/go.mod

      - name: Build sysmon-modular
        run: go -C tooling build -o "$RUNNER_TEMP/sysmon-modular" ./cmd/sysmon-modular

      - name: Generate default configuration
        run: |
          find 23_file_delete -maxdepth 1 -type f -name '*.xml' -print \
            | sort > "$RUNNER_TEMP/file-delete-modules.txt"
          "$RUNNER_TEMP/sysmon-modular" merge \
            --base-path "$GITHUB_WORKSPACE" \
            --template "$GITHUB_WORKSPACE/templates/sysmon_template.xml" \
            --preserve-comments \
            --sysmon-version 15.21 \
            --exclude-list "$RUNNER_TEMP/file-delete-modules.txt" \
            --output "$RUNNER_TEMP/sysmonconfig.xml"

      - name: Build and check matrix
        run: |
          tmpfile=$(mktemp)
          grep -Eo 'technique_id=T[0-9]+([.][0-9]+)?' "$RUNNER_TEMP/sysmonconfig.xml" \
            | sort | uniq -c \
            | sed -E 's/^[[:space:]]*([0-9]+)[[:space:]]+technique_id=([^[:space:]]+)/{"score": \1, "technique_id": "\2"}/' \
            | jq -s 'map({techniqueID: .technique_id, score: .score})' > "$tmpfile"
          jq --slurpfile techniques "$tmpfile" \
            '.techniques = $techniques[0]' ./attack_matrix/Sysmon-modular.json \
            > attack-matrix-15.21.json
          jq empty attack-matrix-15.21.json
          rm "$tmpfile"
