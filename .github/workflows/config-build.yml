name: Build Sysmon configurations

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: generated-configs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  generate-configs:
    name: Validate and generate configurations
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: tooling/go.mod
          cache-dependency-path: tooling/go.mod

      - name: Test Go tooling
        run: go -C tooling test ./...

      - name: Build sysmon-modular
        run: go -C tooling build -o "$RUNNER_TEMP/sysmon-modular" ./cmd/sysmon-modular

      # Remove continue-on-error once the existing module findings have been fixed.
      - name: Validate source modules (non-blocking)
        continue-on-error: true
        run: >-
          "$RUNNER_TEMP/sysmon-modular" validate --all
          --base-path "$GITHUB_WORKSPACE"
          --sysmon-version 15.21

      - name: Select configuration modules
        run: |
          find 23_file_delete -maxdepth 1 -type f -name '*.xml' -print \
            | sort > "$RUNNER_TEMP/file-delete-modules.txt"
          find . -mindepth 2 -maxdepth 2 -type f \
            -path './[0-9]*/*.xml' ! -path './23_file_delete/*' \
            -name 'exclude_*.xml' -print \
            | sed 's#^./##' | sort > "$RUNNER_TEMP/exclude-modules.txt"

      - name: Generate release configurations
        run: |
          mkdir -p release
          for version in 15.21 14.16 13.34 12.03; do
            common=(
              --base-path "$GITHUB_WORKSPACE"
              --template "$GITHUB_WORKSPACE/templates/sysmon_template.xml"
              --preserve-comments
              --sysmon-version "$version"
              --unsupported exclude
              --schema-validate=false
            )
            "$RUNNER_TEMP/sysmon-modular" merge "${common[@]}" \
              --exclude-list "$RUNNER_TEMP/file-delete-modules.txt" \
              --output "release/sysmonconfig-${version}.xml"
            "$RUNNER_TEMP/sysmon-modular" merge "${common[@]}" \
              --output "release/sysmonconfig-with-filedelete-${version}.xml"
            "$RUNNER_TEMP/sysmon-modular" merge "${common[@]}" \
              --include-list "$RUNNER_TEMP/exclude-modules.txt" \
              --output "release/sysmonconfig-excludes-only-${version}.xml"
          done

          # Keep stable aliases for users who always want the current version.
          cp release/sysmonconfig-15.21.xml release/sysmonconfig.xml
          cp release/sysmonconfig-with-filedelete-15.21.xml \
            release/sysmonconfig-with-filedelete.xml
          cp release/sysmonconfig-excludes-only-15.21.xml \
            release/sysmonconfig-excludes-only.xml

      - name: Generate ATT&CK Navigator layer for Sysmon 15.21
        run: |
          techniques=$(mktemp)
          grep -Eo 'technique_id=T[0-9]+([.][0-9]+)?' \
            release/sysmonconfig-15.21.xml \
            | sort | uniq -c \
            | sed -E 's/^[[:space:]]*([0-9]+)[[:space:]]+technique_id=([^[:space:]]+)/{"score": \1, "technique_id": "\2"}/' \
            | jq -s 'map({techniqueID: .technique_id, score: .score})' > "$techniques"
          jq --slurpfile techniques "$techniques" \
            '.techniques = $techniques[0]' attack_matrix/Sysmon-modular.json \
            > release/attack-matrix-15.21.json
          jq empty release/attack-matrix-15.21.json
          rm "$techniques"

      - name: Validate generated configurations
        run: |
          for version in 15.21 14.16 13.34 12.03; do
            for config in release/*-"${version}".xml; do
              "$RUNNER_TEMP/sysmon-modular" validate \
                --path "$config" --mitre=false --sysmon-version "$version"
            done
          done

  publish-release:
    name: Publish configurations to GitHub Releases
    needs: generate-configs
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: tooling/go.mod
          cache-dependency-path: tooling/go.mod

      - name: Build sysmon-modular
        run: go -C tooling build -o "$RUNNER_TEMP/sysmon-modular" ./cmd/sysmon-modular

      - name: Select configuration modules
        run: |
          find 23_file_delete -maxdepth 1 -type f -name '*.xml' -print \
            | sort > "$RUNNER_TEMP/file-delete-modules.txt"
          find . -mindepth 2 -maxdepth 2 -type f \
            -path './[0-9]*/*.xml' ! -path './23_file_delete/*' \
            -name 'exclude_*.xml' -print \
            | sed 's#^./##' | sort > "$RUNNER_TEMP/exclude-modules.txt"

      - name: Generate release configurations
        run: |
          mkdir -p release
          for version in 15.21 14.16 13.34 12.03; do
            common=(
              --base-path "$GITHUB_WORKSPACE"
              --template "$GITHUB_WORKSPACE/templates/sysmon_template.xml"
              --preserve-comments
              --sysmon-version "$version"
              --unsupported exclude
              --schema-validate=false
            )
            "$RUNNER_TEMP/sysmon-modular" merge "${common[@]}" \
              --exclude-list "$RUNNER_TEMP/file-delete-modules.txt" \
              --output "release/sysmonconfig-${version}.xml"
            "$RUNNER_TEMP/sysmon-modular" merge "${common[@]}" \
              --output "release/sysmonconfig-with-filedelete-${version}.xml"
            "$RUNNER_TEMP/sysmon-modular" merge "${common[@]}" \
              --include-list "$RUNNER_TEMP/exclude-modules.txt" \
              --output "release/sysmonconfig-excludes-only-${version}.xml"
          done

          cp release/sysmonconfig-15.21.xml release/sysmonconfig.xml
          cp release/sysmonconfig-with-filedelete-15.21.xml \
            release/sysmonconfig-with-filedelete.xml
          cp release/sysmonconfig-excludes-only-15.21.xml \
            release/sysmonconfig-excludes-only.xml

      - name: Generate ATT&CK Navigator layer for Sysmon 15.21
        run: |
          techniques=$(mktemp)
          grep -Eo 'technique_id=T[0-9]+([.][0-9]+)?' \
            release/sysmonconfig-15.21.xml \
            | sort | uniq -c \
            | sed -E 's/^[[:space:]]*([0-9]+)[[:space:]]+technique_id=([^[:space:]]+)/{"score": \1, "technique_id": "\2"}/' \
            | jq -s 'map({techniqueID: .technique_id, score: .score})' > "$techniques"
          jq --slurpfile techniques "$techniques" \
            '.techniques = $techniques[0]' attack_matrix/Sysmon-modular.json \
            > release/attack-matrix-15.21.json
          jq empty release/attack-matrix-15.21.json
          rm "$techniques"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="configs-${GITHUB_SHA::12}"
          title="Generated Sysmon configurations (${GITHUB_SHA::12})"
          notes="Generated from commit ${GITHUB_SHA} for Sysmon 15.21, 14.16, 13.34, and 12.03."

          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release $tag already exists; nothing to publish."
          else
            gh release create "$tag" release/*.xml release/*.json \
              --target "$GITHUB_SHA" --title "$title" --notes "$notes" --latest
          fi
